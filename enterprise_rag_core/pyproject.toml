[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-core"
version = "0.1.0"
description = "Shared library for Enterprise RAG microservices"
requires-python = ">=3.10"
dependencies = [
    "groq",
    "faiss-cpu",
    "sentence-transformers",
    "nltk",
    "numpy",
    "rank-bm25",
    "openai",
    "anthropic",
    "google-generativeai",
]

[tool.setuptools.packages.find]
include = ["enterprise_rag_core*"]
