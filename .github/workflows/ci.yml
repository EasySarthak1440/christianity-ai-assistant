name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint-python:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check --output-format=github .

  lint-frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build --if-present

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t enterprise-rag-gateway .

  docker-build-services:
    name: Docker Build (Services)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - document_store
          - llm
          - bible
          - upload
          - agent
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t enterprise-rag-${{ matrix.service }} -f services/${{ matrix.service }}/Dockerfile .

  smoke-test:
    name: Smoke Test
    if: github.ref == 'refs/heads/main'
    needs: [docker-build, docker-build-services]
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker compose up -d --wait 2>&1 || true
          echo "Waiting for gateway (accepts 503/000 while models load)..."
          i=0
          while [ $i -lt 60 ]; do
            curl -s -o /tmp/gw-health.txt -w "%{http_code}" http://localhost:8000/health > /tmp/gw-code.txt 2>/dev/null || true
            code=$(cat /tmp/gw-code.txt 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              echo "Gateway ready after ${i}s"
              break
            fi
            echo "Attempt $((i+1)): HTTP ${code}"
            sleep 2
            i=$((i+1))
          done
          health=$(cat /tmp/gw-health.txt 2>/dev/null || echo '{}')
          echo "Gateway health: $health"
          echo "$health" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('ready'), 'not ready'; print('Gateway OK')" || true
          curl -sf http://localhost:8001/health | python3 -c "import sys,json; d=json.load(sys.stdin); print('Document store OK:', d.get('status','?'))" || true
          curl -sf http://localhost:8002/health | python3 -c "import sys,json; d=json.load(sys.stdin); print('LLM OK:', d.get('status','?'))" || true
      - run: docker compose down
